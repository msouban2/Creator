name: Build Android APK

# Builds an installable .apk on a free GitHub-hosted runner using
# `eas build --local` with the `preview` profile (buildType: apk). Unlike the
# Play-Store .aab, an .apk can be sideloaded directly onto a phone — handy for
# testing (push notifications) and for capturing real App Store screenshots.
#
# Uses the same free local-build approach, so it does NOT consume the EAS cloud
# build quota. Trigger from the Actions tab ("Run workflow") or by pushing to
# the `ci-android-apk` branch. Download the `bilkul-apk` artifact when it's done.

on:
  workflow_dispatch:
  push:
    branches:
      - ci-android-apk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install project dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android .apk (local, signed with EAS credentials)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/bilkul.apk"

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilkul-apk
          path: bilkul.apk
          if-no-files-found: error
          retention-days: 14
