name: Build Android AAB

# Builds a Play-Store-ready .aab on a free GitHub-hosted runner using
# `eas build --local`. This runs the Gradle build ON the runner (not on
# EAS's cloud), so it does NOT consume the EAS cloud build quota, while
# still downloading the app's managed Android keystore from EAS so the
# bundle is signed with the correct upload key.
#
# One-time setup: add a repository secret named EXPO_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret).
#
# Trigger it from the Actions tab ("Run workflow"), or by pushing to the
# `ci-android-build` branch.

on:
  workflow_dispatch:
  push:
    branches:
      - ci-android-build

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install project dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android .aab (local, signed with EAS credentials)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production --local --non-interactive --output "$GITHUB_WORKSPACE/bilkul.aab"

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilkul-aab
          path: bilkul.aab
          if-no-files-found: error
          retention-days: 14
